<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compact nested quote photo fixture</title>
    <style>
      body {
        margin: 0;
        background: #000;
        color: #eee;
        font: 16px sans-serif;
      }
      #host-layout-spacer {
        height: 1200px;
      }
      article {
        box-sizing: border-box;
        max-width: 640px;
        padding: 12px;
      }
      .quote {
        margin: 12px;
        padding: 12px;
        border: 1px solid #777;
      }
      .avatar {
        width: 40px;
        height: 40px;
      }
      .compact-preview {
        position: relative;
        width: 62px;
        height: 62px;
      }
      .compact-preview img {
        display: block;
        width: 62px;
        height: 62px;
      }
      .compact-preview .hit-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #b-media-slot {
        position: relative;
        width: 62px;
        height: 62px;
      }
      #b-media-slot img {
        width: 62px;
        height: 62px;
      }
      #b-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="host-layout-spacer" aria-hidden="true"></div>
    <main>
      <article id="compact-a" data-testid="tweet">
        <div class="quote" role="link" id="compact-b">
          <a href="/middle_fixture/status/9555555555555555555">Middle quote context</a>
          <article>
            <header>
              <img
                class="avatar"
                src="https://pbs.twimg.com/profile_images/2/fixture-b.jpg"
                alt=""
              />
              <a id="b-header" href="/middle_fixture/status/9555555555555555555">Middle quote</a>
            </header>
            <div id="b-media-slot"></div>
            <div class="quote" role="link" id="compact-c">
              <a href="/inner_fixture/status/7555555555555555555">Inner quote context</a>
              <span aria-hidden="true"></span>
              <div>
                <div>
                  <div class="quote-heading">
                    <div>
                      <img
                        class="avatar"
                        src="https://pbs.twimg.com/profile_images/3/fixture-c.jpg"
                        alt=""
                      />
                    </div>
                    <div>
                      <span
                        ><a id="c-header" href="/inner_fixture/status/7555555555555555555"
                          >Inner quote</a
                        ></span
                      >
                    </div>
                  </div>
                </div>
                <div>
                  <div class="compact-preview" id="c-preview">
                    <div>
                      <a href="/inner_fixture/status/7555555555555555555">
                        <img
                          id="c-photo"
                          src="https://pbs.twimg.com/media/CompactQuoteSelected?format=webp&amp;name=medium"
                          alt="Fixture photo"
                        />
                      </a>
                    </div>
                    <a
                      class="hit-overlay"
                      id="c-overlay"
                      href="/inner_fixture/status/7555555555555555555"
                      aria-label="Open inner quote photo"
                    ></a>
                  </div>
                </div>
              </div>
            </div>
          </article>
        </div>
        <header>
          <img class="avatar" src="https://pbs.twimg.com/profile_images/1/fixture-a.jpg" alt="" />
          <a id="a-header" href="/outer_fixture/status/8555555555555555555">Outer post</a>
          <a href="/outer_fixture/status/8555555555555555555"><time>Fixture time</time></a>
        </header>
      </article>
    </main>
  </body>
</html>

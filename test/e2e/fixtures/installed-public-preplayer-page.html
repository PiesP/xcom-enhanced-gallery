<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Installed unmarked quoted video preview fixture</title>
  <style>
    body { margin: 0; padding: 20px; background: #000; color: #e7e9ea; font: 16px "Segoe UI", sans-serif; }
    #host-layout-spacer { height: 1200px; }
    .quote-case { max-width: 640px; margin: 0 auto; }
    .quote-branch { margin: 20px; padding: 12px; border: 1px solid #555; }
    .quote-header, .credit { display: flex; gap: 8px; align-items: center; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; }
    .media-shell { width: 320px; height: 180px; position: relative; margin: 12px 0; }
    .media-shell > .avatar { position: absolute; top: 4px; right: 4px; z-index: 1; }
    .media-shell > .avatar:nth-child(2) { right: 40px; }
    .media-shell > .thumbnail { width: 320px; height: 180px; display: block; }
    .control-surface { position: absolute; inset: 0; z-index: 2; }
    .control-surface > button { width: 100%; height: 100%;
      border: 0; background: transparent; color: white; cursor: pointer; }
    .control-surface > button > span { display: inline-grid; place-items: center;
      width: 54px; height: 54px; border-radius: 50%; background: #1d9bf0; }
  </style>
</head>
<body>
  <div id="host-layout-spacer" aria-hidden="true"></div>
  <main>
    <article class="quote-case" data-case="public-preplayer" data-testid="tweet">
      <header>
        <a href="/outer_preplayer/status/8555555555555555555">Outer A identity</a>
        <a href="/outer_preplayer/status/8555555555555555555">Outer A context</a>
      </header>
      <div role="link" class="quote-branch">
        <article>
          <div class="quote-header">
            <a href="/quote_preplayer/status/9555555555555555555">Quoted B header</a>
          </div>
          <div class="media-wrapper" data-preplayer-wrapper>
            <div class="media-shell" data-preplayer-media>
              <img class="avatar" src="https://pbs.twimg.com/profile_images/1/preplayer-b.jpg" alt="">
              <img class="avatar" src="https://pbs.twimg.com/profile_images/2/preplayer-c.jpg" alt="">
              <img class="thumbnail"
                src="https://pbs.twimg.com/ext_tw_video_thumb/9555555555555555555/pu/img/quote-two.jpg"
                alt="Quoted video thumbnail">
              <div class="control-surface">
                <button type="button" aria-label="Play quoted video"><span aria-hidden="true">▶</span></button>
              </div>
            </div>
            <div class="credit">
              <a href="/credit_preplayer/status/7555555555555555555">Credit C</a>
            </div>
          </div>
        </article>
      </div>
    </article>
  </main>
</body>
</html>

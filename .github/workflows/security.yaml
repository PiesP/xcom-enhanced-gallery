name: 🔒 Security Scanning

# Responsibility: Security analysis for Node.js + pnpm project
# - Default branch/PR/merge queue: CodeQL, OSV, and Semgrep secrets
# - PR gate: OSV diff scan; merge queue: full OSV scan
# - Scheduled/manual diagnostics: pinned-tool freshness, full OSV scan, and full Semgrep SARIF
#
# Full Semgrep source analysis runs on the weekly schedule or manually; the
# required PR check retains secrets coverage on every relevant change.
#
# Trigger: Push/PR to master + merge queue + weekly schedule + manual

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 1 * * 0" # Weekly at 1 AM UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-metadata:
    name: Resolve reviewed scanner images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      OSV_SCANNER_IMAGE: ${{ steps.pins.outputs.OSV_SCANNER_IMAGE }}
      SEMGREP_IMAGE: ${{ steps.pins.outputs.SEMGREP_IMAGE }}
    steps:
      - name: 📥 Checkout reviewed pin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a1fd01821cab105c6a6430ee81e18030532843e8
          persist-credentials: false
          submodules: false

      - name: 📦 Setup reviewed pin runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔐 Export validated scanner images
        id: pins
        run: |
          set -euo pipefail
          pinned_dir="$(mktemp -d "$RUNNER_TEMP/pinned-tools.XXXXXXXX")"
          for name in pinned-tools.json pinned-tools.ts check-pinned-tools.ts install-nose.ts; do
            install -m 0600 "scripts/ci/$name" "$pinned_dir/$name"
          done
          GITHUB_ENV="$GITHUB_OUTPUT" node --experimental-strip-types "$pinned_dir/pinned-tools.ts" env

  changes:
    name: Classify security-relevant paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      osv: ${{ steps.classify.outputs.osv }}
      semgrep: ${{ steps.classify.outputs.semgrep }}
      codeql_actions: ${{ steps.classify.outputs.codeql_actions }}
      codeql_javascript: ${{ steps.classify.outputs.codeql_javascript }}
    steps:
      - name: 📥 Checkout change history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: 📦 Setup classifier runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🧭 Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          classifier=scripts/ci/classify-changes.ts
          case "$EVENT_NAME" in
            pull_request | merge_group)
              classifier="$RUNNER_TEMP/trusted-classify-changes.ts"
              if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
                 ! git show "$BASE_SHA:scripts/ci/classify-changes.ts" > "$classifier"; then
                for output in quality unit e2e build duplication osv semgrep codeql_actions codeql_javascript; do
                  echo "$output=true" >> "$GITHUB_OUTPUT"
                done
                echo 'reason=trusted-classifier-unavailable-full' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac
          node --experimental-strip-types "$classifier"

  pinned-tools:
    name: 🔄 Pinned tool freshness
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: a1fd01821cab105c6a6430ee81e18030532843e8
          persist-credentials: false
          submodules: false

      - name: 📦 Setup reviewed pin runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔎 Check pinned tools after the cooling window
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pinned_dir="$(mktemp -d "$RUNNER_TEMP/pinned-tools.XXXXXXXX")"
          for name in pinned-tools.json pinned-tools.ts check-pinned-tools.ts install-nose.ts; do
            install -m 0600 "scripts/ci/$name" "$pinned_dir/$name"
          done
          node --experimental-strip-types "$pinned_dir/check-pinned-tools.ts"

  osv-scan-pr:
    name: pr-gate/osv / osv-scan
    needs: [changes, pin-metadata]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      OSV_SCANNER_IMAGE: ${{ needs['pin-metadata'].outputs.OSV_SCANNER_IMAGE }}
    steps:
      - name: ❌ Require reviewed scanner image
        if: ${{ needs['pin-metadata'].result != 'success' }}
        run: exit 1

      - name: ⏭️ No dependency-relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.osv == 'false' }}
        run: echo "No dependency-relevant changes; required check satisfied."

      - name: 📥 Checkout PR result and history
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: ⏪ Checkout the trusted PR base
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git switch --force --detach "$BASE_SHA"
          git submodule update --init --recursive

      - name: 📦 Setup trusted OSV runtime
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔒 Prepare pinned OSV helper
        id: osv-helper
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        uses: PiesP/browser-core/automation/actions/prepare-osv@9a9471ad301e439bcd1ebc52334cf6b4399510e7

      - name: 📁 Prepare private OSV result directory
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          : > "$RUNNER_TEMP/osv-results/osv-empty.toml"

      - name: 🛡️ Scan dependencies before the PR
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" scan-old consumer

      - name: ⏩ Checkout the PR result
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: 🛡️ Scan dependencies after the PR
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" scan-new consumer

      - name: 📋 Report newly introduced vulnerabilities
        id: osv-report
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" report-pr consumer

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() && steps.osv-report.outputs.sarif-upload == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.osv != 'false') }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  osv-scan-dispatch:
    name: pr-gate/osv / osv-scan
    needs: [changes, pin-metadata]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OSV_SCANNER_IMAGE: ${{ needs['pin-metadata'].outputs.OSV_SCANNER_IMAGE }}
    steps:
      - name: ❌ Require reviewed scanner image
        if: ${{ needs['pin-metadata'].result != 'success' }}
        run: exit 1

      - name: ⏭️ No dependency-relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.osv == 'false' }}
        run: echo "No dependency-relevant changes; required check satisfied."

      - name: 📥 Checkout target and history
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: 🔒 Select trusted OSV runtime manifest
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        env:
          POLICY_SHA: ${{ github.event.merge_group.base_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$POLICY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            if ! git cat-file -e "$POLICY_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
            fi
            git cat-file -e "$POLICY_SHA^{commit}"
            git switch --force --detach "$POLICY_SHA"
          else
            [[ "$POLICY_SHA" == "$GITHUB_SHA" ]]
          fi

      - name: 📦 Setup trusted OSV runtime
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔒 Prepare pinned OSV helper
        id: osv-helper
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        uses: PiesP/browser-core/automation/actions/prepare-osv@9a9471ad301e439bcd1ebc52334cf6b4399510e7

      - name: 📁 Prepare private OSV result directory
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          : > "$RUNNER_TEMP/osv-results/osv-empty.toml"

      - name: ⏩ Restore target for the full scan
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: 🛡️ Run OSV scan
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" scan-full consumer

      - name: 📋 Convert OSV results to SARIF and enforce the vulnerability gate
        id: osv-report
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        env:
          OSV_HELPER: ${{ steps.osv-helper.outputs.helper-path }}
        run: node --strip-types "$OSV_HELPER" report-full consumer

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() && steps.osv-report.outputs.sarif-upload == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.osv != 'false') }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  codeql:
    name: 🔎 CodeQL Analysis (${{ matrix.language }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: 🧭 Select CodeQL language scope
        id: scope
        env:
          ACTIONS_CHANGED: ${{ needs.changes.outputs.codeql_actions }}
          JAVASCRIPT_CHANGED: ${{ needs.changes.outputs.codeql_javascript }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          run=false
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            run=true
          elif [[ "$LANGUAGE" == "actions" && "$ACTIONS_CHANGED" != "false" ]]; then
            run=true
          elif [[ "$LANGUAGE" == "javascript-typescript" && "$JAVASCRIPT_CHANGED" != "false" ]]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: ⏭️ No ${{ matrix.language }} CodeQL-relevant changes
        if: ${{ steps.scope.outputs.run != 'true' }}
        run: echo "No ${{ matrix.language }} CodeQL-relevant changes."

      - name: 📥 Checkout code
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔧 Initialize CodeQL
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: 🔎 Perform CodeQL Analysis
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: pr-gate/semgrep
    needs: [changes, pin-metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    permissions:
      contents: read
      security-events: write
    container:
      image: ${{ needs['pin-metadata'].outputs.SEMGREP_IMAGE || 'invalid@@' }}
    steps:
      - name: ❌ Require reviewed scanner image
        if: ${{ needs['pin-metadata'].result != 'success' }}
        run: exit 1

      - name: ⏭️ No Semgrep-relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.semgrep == 'false' }}
        run: echo "No Semgrep-relevant changes; required check satisfied."

      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.semgrep != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔍 Run Semgrep scan
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.semgrep != 'false' }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            semgrep scan \
              --config=p/typescript \
              --config=p/javascript \
              --config=p/security-audit \
              --config=p/secrets \
              --error \
              --sarif \
              --output=semgrep.sarif \
              .
          else
            semgrep scan \
              --config=p/secrets \
              --error \
              --sarif \
              --output=semgrep.sarif \
              .
          fi

      - name: 📊 Upload SARIF to GitHub Security
        if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.semgrep != 'false') && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif

name: 🔒 Security Scanning

# Responsibility: Security analysis for Node.js + pnpm project
# - Default branch/PR/merge queue: CodeQL, OSV, and Semgrep
# - PR gate: OSV diff scan
# - Merge queue/manual gate: OSV full scan
# - Scheduled/manual depth: pinned-tool freshness + OSV full scan + Semgrep SARIF
#
# Trigger: Push/PR to master + merge queue + daily schedule + manual

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 1 * * *" # Daily at 1 AM UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # google/osv-scanner-action image v2.5.0 (linux/amd64), resolved 2026-08-08.
  # Pin the runtime image itself: the upstream action metadata references a
  # mutable version tag even when the action is pinned to a commit SHA.
  OSV_SCANNER_IMAGE: "ghcr.io/google/osv-scanner-action@sha256:4cc9d6b5a6bb3a81c38c8d1610f6855512ddd1ba5af77083a856f171dbd0d463"

jobs:
  changes:
    name: Classify security-relevant paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      osv: ${{ steps.classify.outputs.osv }}
      semgrep: ${{ steps.classify.outputs.semgrep }}
      codeql_actions: ${{ steps.classify.outputs.codeql_actions }}
      codeql_javascript: ${{ steps.classify.outputs.codeql_javascript }}
    steps:
      - name: 📥 Checkout change history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: 🧭 Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: bash scripts/ci/classify-changes.sh

  pinned-tools:
    name: 🔄 Pinned tool freshness
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check pinned tools after the cooling window
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/check-pinned-tools.sh

  osv-scan-pr:
    name: pr-gate/osv / osv-scan
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: ⏭️ No dependency-relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.osv == 'false' }}
        run: echo "No dependency-relevant changes; required check satisfied."

      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: ⏪ Checkout the PR base
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git switch --force --detach "$BASE_SHA"
          git submodule update --init --recursive

      - name: 📁 Prepare isolated OSV result directory
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/osv-results"

      - name: 🛡️ Scan dependencies before the PR
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        continue-on-error: true
        run: |
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --format=json \
            --output-file=/results/old-results.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            .

      - name: ⏩ Checkout the PR result
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: 🛡️ Scan dependencies after the PR
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        continue-on-error: true
        run: |
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --format=json \
            --output-file=/results/new-results.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            .

      - name: 📋 Report newly introduced vulnerabilities
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --old=old-results.json \
            --new=new-results.json \
            --output-files=sarif:osv-results.sarif \
            '--output-files=gh-annotations:#stderr' \
            --fail-on-vuln=true

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.osv != 'false') }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  osv-scan-dispatch:
    name: pr-gate/osv / osv-scan
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⏭️ No dependency-relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.osv == 'false' }}
        run: echo "No dependency-relevant changes; required check satisfied."

      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🛡️ Run OSV scan
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --format=json \
            --output-file=/results/osv-results.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            .

      - name: 📋 Convert OSV results to SARIF and enforce the vulnerability gate
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --output-files=sarif:osv-results.sarif \
            --new=osv-results.json \
            --fail-on-vuln=true

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.osv != 'false') }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  codeql:
    name: 🔎 CodeQL Analysis (${{ matrix.language }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: 🧭 Select CodeQL language scope
        id: scope
        env:
          ACTIONS_CHANGED: ${{ needs.changes.outputs.codeql_actions }}
          JAVASCRIPT_CHANGED: ${{ needs.changes.outputs.codeql_javascript }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          run=false
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            run=true
          elif [[ "$LANGUAGE" == "actions" && "$ACTIONS_CHANGED" != "false" ]]; then
            run=true
          elif [[ "$LANGUAGE" == "javascript-typescript" && "$JAVASCRIPT_CHANGED" != "false" ]]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: ⏭️ No ${{ matrix.language }} CodeQL-relevant changes
        if: ${{ steps.scope.outputs.run != 'true' }}
        run: echo "No ${{ matrix.language }} CodeQL-relevant changes."

      - name: 📥 Checkout code
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔧 Initialize CodeQL
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: 🔎 Perform CodeQL Analysis
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: pr-gate/semgrep
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    permissions:
      contents: read
      security-events: write
    # semgrep/semgrep:1.172.0 (linux/amd64) — last checked: 2026-08-04
    # Check for updates: https://github.com/semgrep/semgrep/releases
    container:
      image: semgrep/semgrep:1.172.0@sha256:a8298d1c09c84b9a0bbc75ec915e37023fc4657360b6dbfa645261d2353a366c
    steps:
      - name: ⏭️ No Semgrep-relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.semgrep == 'false' }}
        run: echo "No Semgrep-relevant changes; required check satisfied."

      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.semgrep != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔍 Run Semgrep scan
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.semgrep != 'false' }}
        run: |
          set -euo pipefail
          semgrep scan \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --sarif \
            --output=semgrep.sarif \
            .

      - name: 📊 Upload SARIF to GitHub Security
        if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.semgrep != 'false') && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: semgrep.sarif

  report-pr-gate-statuses:
    name: Report PR gate statuses
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [osv-scan-dispatch, semgrep]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish required commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          OSV_RESULT: ${{ needs.osv-scan-dispatch.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: |
          set -euo pipefail

          publish_status() {
            local context="$1"
            local result="$2"
            local state=success
            if [[ "$result" != "success" ]]; then
              state=failure
            fi

            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f "state=$state" \
              -f "context=$context" \
              -f "description=workflow_dispatch result: $result" \
              -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >/dev/null
          }

          publish_status "pr-gate/osv / osv-scan" "$OSV_RESULT"
          publish_status "pr-gate/semgrep" "$SEMGREP_RESULT"

name: 🔒 Security Scanning

# Responsibility: Security analysis for Node.js + pnpm project
# - Default branch/PR/merge queue: CodeQL, OSV, and Semgrep
# - PR gate: OSV diff scan
# - Merge queue/manual gate: OSV full scan
# - Scheduled/manual depth: pinned-tool freshness + OSV full scan + Semgrep SARIF
#
# Trigger: Push/PR to master + merge queue + daily schedule + manual

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "0 1 * * *" # Daily at 1 AM UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # google/osv-scanner-action image v2.5.1 (linux/amd64), resolved 2026-08-20.
  # Pin the runtime image itself: the upstream action metadata references a
  # mutable version tag even when the action is pinned to a commit SHA.
  OSV_SCANNER_IMAGE: "ghcr.io/google/osv-scanner-action@sha256:dcd947131d8d11b8d0964de6590661fb921a4ecbd7b90a7cb21083acfc3fd8cc"

jobs:
  changes:
    name: Classify security-relevant paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      osv: ${{ steps.classify.outputs.osv }}
      semgrep: ${{ steps.classify.outputs.semgrep }}
      codeql_actions: ${{ steps.classify.outputs.codeql_actions }}
      codeql_javascript: ${{ steps.classify.outputs.codeql_javascript }}
    steps:
      - name: 📥 Checkout change history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: 🧭 Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          classifier=scripts/ci/classify-changes.sh
          case "$EVENT_NAME" in
            pull_request | merge_group)
              classifier="$RUNNER_TEMP/trusted-classify-changes.sh"
              [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
              git show "$BASE_SHA:scripts/ci/classify-changes.sh" > "$classifier"
              ;;
          esac
          bash "$classifier"

  pinned-tools:
    name: 🔄 Pinned tool freshness
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔎 Check pinned tools after the cooling window
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/check-pinned-tools.sh

  osv-scan-pr:
    name: pr-gate/osv / osv-scan
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: ⏭️ No dependency-relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.osv == 'false' }}
        run: echo "No dependency-relevant changes; required check satisfied."

      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: ⏪ Checkout the PR base
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git switch --force --detach "$BASE_SHA"
          git submodule update --init --recursive

      - name: 📁 Prepare base-pinned OSV policy and result directory
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          install -m 0600 .github/codex-security/osv-scanner.toml "$RUNNER_TEMP/osv-results/osv-scanner.toml"
          install -m 0600 scripts/security/scope-osv-exceptions.py "$RUNNER_TEMP/osv-results/scope-osv-exceptions.py"
          : > "$RUNNER_TEMP/osv-results/osv-empty.toml"

      - name: 🛡️ Scan dependencies before the PR
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/osv-results"
          raw_reporter_log="$results_dir/old-results.raw.reporter.log"
          rm -f "$results_dir/old-results.raw.json" "$results_dir/old-results.json" "$raw_reporter_log"
          scan_status=0
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --config=/results/osv-empty.toml \
            --format=json \
            --output-file=/results/old-results.raw.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            . || scan_status=$?
          if ((scan_status > 1)); then
            exit "$scan_status"
          fi
          set +e
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --new=old-results.raw.json \
            --output-files=json:/dev/null \
            --fail-on-vuln=false 2>&1 | tee "$raw_reporter_log"
          raw_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          raw_report_status="${raw_pipeline_status[0]}"
          if ((raw_pipeline_status[1] != 0)); then
            exit "${raw_pipeline_status[1]}"
          fi
          if grep -Eq '^failed to open (old|new) results at ' "$raw_reporter_log"; then
            echo "OSV reporter rejected the raw scanner output." >&2
            exit 2
          fi
          if ((raw_report_status != 0)); then
            exit "$raw_report_status"
          fi
          python3 "$RUNNER_TEMP/osv-results/scope-osv-exceptions.py" \
            --policy "$RUNNER_TEMP/osv-results/osv-scanner.toml" \
            --input "$RUNNER_TEMP/osv-results/old-results.raw.json" \
            --output "$RUNNER_TEMP/osv-results/old-results.json"

      - name: ⏩ Checkout the PR result
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          set -euo pipefail
          git switch --force --detach "$GITHUB_SHA"
          git submodule update --init --recursive

      - name: 🛡️ Scan dependencies after the PR
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/osv-results"
          raw_reporter_log="$results_dir/new-results.raw.reporter.log"
          rm -f "$results_dir/new-results.raw.json" "$results_dir/new-results.json" "$raw_reporter_log"
          scan_status=0
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --config=/results/osv-empty.toml \
            --format=json \
            --output-file=/results/new-results.raw.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            . || scan_status=$?
          if ((scan_status > 1)); then
            exit "$scan_status"
          fi
          set +e
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --new=new-results.raw.json \
            --output-files=json:/dev/null \
            --fail-on-vuln=false 2>&1 | tee "$raw_reporter_log"
          raw_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          raw_report_status="${raw_pipeline_status[0]}"
          if ((raw_pipeline_status[1] != 0)); then
            exit "${raw_pipeline_status[1]}"
          fi
          if grep -Eq '^failed to open (old|new) results at ' "$raw_reporter_log"; then
            echo "OSV reporter rejected the raw scanner output." >&2
            exit 2
          fi
          if ((raw_report_status != 0)); then
            exit "$raw_report_status"
          fi
          python3 "$RUNNER_TEMP/osv-results/scope-osv-exceptions.py" \
            --policy "$RUNNER_TEMP/osv-results/osv-scanner.toml" \
            --input "$RUNNER_TEMP/osv-results/new-results.raw.json" \
            --output "$RUNNER_TEMP/osv-results/new-results.json"

      - name: 📋 Report newly introduced vulnerabilities
        id: osv-report
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/osv-results"
          reporter_log="$results_dir/osv-reporter.log"
          rm -f "$results_dir/osv-results.sarif" "$reporter_log"
          python3 -I - "$results_dir" old-results.json new-results.json <<'PY'
          from pathlib import Path
          import runpy
          import sys

          results_dir = Path(sys.argv[1])
          validator = runpy.run_path(
              str(results_dir / "scope-osv-exceptions.py"),
              run_name="scope_osv_validator",
          )
          for name in sys.argv[2:]:
              report = validator["load_report"](results_dir / name)
              validator["validate_and_filter_report"](report, frozenset())
          PY
          set +e
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --old=old-results.json \
            --new=new-results.json \
            --output-files=sarif:osv-results.sarif \
            '--output-files=gh-annotations:#stderr' \
            --fail-on-vuln=true 2>&1 | tee "$reporter_log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          report_status="${pipeline_status[0]}"
          if ((pipeline_status[1] != 0)); then
            exit "${pipeline_status[1]}"
          fi
          if grep -Eq '^failed to open (old|new) results at ' "$reporter_log"; then
            echo "OSV reporter rejected an input document." >&2
            exit 2
          fi
          if ((report_status > 1)); then
            exit "$report_status"
          fi
          SARIF_PATH="$results_dir/osv-results.sarif" REPORT_STATUS="$report_status" python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          def reject_duplicate_keys(pairs):
              document = {}
              for key, value in pairs:
                  if key in document:
                      raise ValueError(f"SARIF contains duplicate key: {key}")
                  document[key] = value
              return document

          sarif_path = Path(os.environ["SARIF_PATH"])
          with sarif_path.open("r", encoding="utf-8") as sarif_file:
              sarif = json.load(sarif_file, object_pairs_hook=reject_duplicate_keys)
          if not isinstance(sarif, dict) or sarif.get("version") != "2.1.0":
              raise ValueError("reporter output is not SARIF 2.1.0")
          runs = sarif.get("runs")
          if not isinstance(runs, list) or len(runs) != 1:
              raise ValueError("reporter SARIF must contain exactly one run")
          run = runs[0]
          if not isinstance(run, dict):
              raise ValueError("reporter SARIF run must be an object")
          tool = run.get("tool")
          driver = tool.get("driver") if isinstance(tool, dict) else None
          if not isinstance(driver, dict) or driver.get("name") != "osv-scanner":
              raise ValueError("reporter SARIF tool identity is invalid")
          results = run.get("results")
          if not isinstance(results, list) or not all(isinstance(item, dict) for item in results):
              raise ValueError("reporter SARIF results must be an array of objects")
          report_status = int(os.environ["REPORT_STATUS"])
          if report_status == 1 and not results:
              raise ValueError("reporter failed for vulnerabilities but emitted no SARIF results")
          PY
          echo "sarif-upload=true" >> "$GITHUB_OUTPUT"
          exit "$report_status"

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() && steps.osv-report.outputs.sarif-upload == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.osv != 'false') }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  osv-scan-dispatch:
    name: pr-gate/osv / osv-scan
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⏭️ No dependency-relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.osv == 'false' }}
        run: echo "No dependency-relevant changes; required check satisfied."

      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 📁 Prepare trusted OSV policy and result directory
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        env:
          POLICY_SHA: ${{ github.event.merge_group.base_sha || github.sha }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/osv-results"
          if [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            [[ "$POLICY_SHA" =~ ^[0-9a-f]{40}$ ]]
            if ! git cat-file -e "$POLICY_SHA^{commit}" 2>/dev/null; then
              if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
                git fetch --no-tags --prune --unshallow origin
              else
                git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
              fi
            fi
            git cat-file -e "$POLICY_SHA^{commit}"
            git show "$POLICY_SHA:.github/codex-security/osv-scanner.toml" > "$RUNNER_TEMP/osv-results/osv-scanner.toml"
            git show "$POLICY_SHA:scripts/security/scope-osv-exceptions.py" > "$RUNNER_TEMP/osv-results/scope-osv-exceptions.py"
            chmod 0600 "$RUNNER_TEMP/osv-results/osv-scanner.toml"
            chmod 0600 "$RUNNER_TEMP/osv-results/scope-osv-exceptions.py"
          else
            install -m 0600 .github/codex-security/osv-scanner.toml "$RUNNER_TEMP/osv-results/osv-scanner.toml"
            install -m 0600 scripts/security/scope-osv-exceptions.py "$RUNNER_TEMP/osv-results/scope-osv-exceptions.py"
          fi
          : > "$RUNNER_TEMP/osv-results/osv-empty.toml"

      - name: 🛡️ Run OSV scan
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/osv-results"
          raw_reporter_log="$results_dir/osv-results.raw.reporter.log"
          rm -f "$results_dir/osv-results.raw.json" "$results_dir/osv-results.json" "$raw_reporter_log"
          scan_status=0
          docker run --rm \
            --env GOTOOLCHAIN=auto \
            --volume "$GITHUB_WORKSPACE:/src" \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /src \
            "$OSV_SCANNER_IMAGE" \
            --config=/results/osv-empty.toml \
            --format=json \
            --output-file=/results/osv-results.raw.json \
            -r \
            --lockfile=pnpm-lock.yaml \
            . || scan_status=$?
          if ((scan_status > 1)); then
            exit "$scan_status"
          fi
          set +e
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --new=osv-results.raw.json \
            --output-files=json:/dev/null \
            --fail-on-vuln=false 2>&1 | tee "$raw_reporter_log"
          raw_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          raw_report_status="${raw_pipeline_status[0]}"
          if ((raw_pipeline_status[1] != 0)); then
            exit "${raw_pipeline_status[1]}"
          fi
          if grep -Eq '^failed to open (old|new) results at ' "$raw_reporter_log"; then
            echo "OSV reporter rejected the raw scanner output." >&2
            exit 2
          fi
          if ((raw_report_status != 0)); then
            exit "$raw_report_status"
          fi
          python3 "$RUNNER_TEMP/osv-results/scope-osv-exceptions.py" \
            --policy "$RUNNER_TEMP/osv-results/osv-scanner.toml" \
            --input "$RUNNER_TEMP/osv-results/osv-results.raw.json" \
            --output "$RUNNER_TEMP/osv-results/osv-results.json"

      - name: 📋 Convert OSV results to SARIF and enforce the vulnerability gate
        id: osv-report
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.osv != 'false' }}
        run: |
          set -euo pipefail
          results_dir="$RUNNER_TEMP/osv-results"
          reporter_log="$results_dir/osv-reporter.log"
          rm -f "$results_dir/osv-results.sarif" "$reporter_log"
          python3 -I - "$results_dir" osv-results.json <<'PY'
          from pathlib import Path
          import runpy
          import sys

          results_dir = Path(sys.argv[1])
          validator = runpy.run_path(
              str(results_dir / "scope-osv-exceptions.py"),
              run_name="scope_osv_validator",
          )
          for name in sys.argv[2:]:
              report = validator["load_report"](results_dir / name)
              validator["validate_and_filter_report"](report, frozenset())
          PY
          set +e
          docker run --rm \
            --entrypoint /root/osv-reporter \
            --volume "$RUNNER_TEMP/osv-results:/results" \
            --workdir /results \
            "$OSV_SCANNER_IMAGE" \
            --output-files=sarif:osv-results.sarif \
            --new=osv-results.json \
            --fail-on-vuln=true 2>&1 | tee "$reporter_log"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          report_status="${pipeline_status[0]}"
          if ((pipeline_status[1] != 0)); then
            exit "${pipeline_status[1]}"
          fi
          if grep -Eq '^failed to open (old|new) results at ' "$reporter_log"; then
            echo "OSV reporter rejected an input document." >&2
            exit 2
          fi
          if ((report_status > 1)); then
            exit "$report_status"
          fi
          SARIF_PATH="$results_dir/osv-results.sarif" REPORT_STATUS="$report_status" python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          def reject_duplicate_keys(pairs):
              document = {}
              for key, value in pairs:
                  if key in document:
                      raise ValueError(f"SARIF contains duplicate key: {key}")
                  document[key] = value
              return document

          sarif_path = Path(os.environ["SARIF_PATH"])
          with sarif_path.open("r", encoding="utf-8") as sarif_file:
              sarif = json.load(sarif_file, object_pairs_hook=reject_duplicate_keys)
          if not isinstance(sarif, dict) or sarif.get("version") != "2.1.0":
              raise ValueError("reporter output is not SARIF 2.1.0")
          runs = sarif.get("runs")
          if not isinstance(runs, list) or len(runs) != 1:
              raise ValueError("reporter SARIF must contain exactly one run")
          run = runs[0]
          if not isinstance(run, dict):
              raise ValueError("reporter SARIF run must be an object")
          tool = run.get("tool")
          driver = tool.get("driver") if isinstance(tool, dict) else None
          if not isinstance(driver, dict) or driver.get("name") != "osv-scanner":
              raise ValueError("reporter SARIF tool identity is invalid")
          results = run.get("results")
          if not isinstance(results, list) or not all(isinstance(item, dict) for item in results):
              raise ValueError("reporter SARIF results must be an array of objects")
          report_status = int(os.environ["REPORT_STATUS"])
          if report_status == 1 and not results:
              raise ValueError("reporter failed for vulnerabilities but emitted no SARIF results")
          PY
          echo "sarif-upload=true" >> "$GITHUB_OUTPUT"
          exit "$report_status"

      - name: 📊 Upload OSV SARIF to GitHub Security
        if: ${{ !cancelled() && steps.osv-report.outputs.sarif-upload == 'true' && (needs.changes.result != 'success' || needs.changes.outputs.osv != 'false') }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ runner.temp }}/osv-results/osv-results.sarif

  codeql:
    name: 🔎 CodeQL Analysis (${{ matrix.language }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: 🧭 Select CodeQL language scope
        id: scope
        env:
          ACTIONS_CHANGED: ${{ needs.changes.outputs.codeql_actions }}
          JAVASCRIPT_CHANGED: ${{ needs.changes.outputs.codeql_javascript }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          run=false
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            run=true
          elif [[ "$LANGUAGE" == "actions" && "$ACTIONS_CHANGED" != "false" ]]; then
            run=true
          elif [[ "$LANGUAGE" == "javascript-typescript" && "$JAVASCRIPT_CHANGED" != "false" ]]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: ⏭️ No ${{ matrix.language }} CodeQL-relevant changes
        if: ${{ steps.scope.outputs.run != 'true' }}
        run: echo "No ${{ matrix.language }} CodeQL-relevant changes."

      - name: 📥 Checkout code
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔧 Initialize CodeQL
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: 🔎 Perform CodeQL Analysis
        if: ${{ steps.scope.outputs.run == 'true' }}
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"

  semgrep:
    name: pr-gate/semgrep
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
    permissions:
      contents: read
      security-events: write
    # semgrep/semgrep:1.177.0 (linux/amd64) — last checked: 2026-09-14
    # Check for updates: https://github.com/semgrep/semgrep/releases
    container:
      image: semgrep/semgrep:1.177.0@sha256:d1825c2c72110b5bfbf0602ff68f7f117322597a7c33037a79dba9f897f5f1f0
    steps:
      - name: ⏭️ No Semgrep-relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.semgrep == 'false' }}
        run: echo "No Semgrep-relevant changes; required check satisfied."

      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.semgrep != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: 🔍 Run Semgrep scan
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.semgrep != 'false' }}
        run: |
          set -euo pipefail
          semgrep scan \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --sarif \
            --output=semgrep.sarif \
            .

      - name: 📊 Upload SARIF to GitHub Security
        if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.semgrep != 'false') && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: semgrep.sarif

  report-pr-gate-statuses:
    name: Report PR gate statuses
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [osv-scan-dispatch, semgrep]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish required commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          OSV_RESULT: ${{ needs.osv-scan-dispatch.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
        run: |
          set -euo pipefail

          publish_status() {
            local context="$1"
            local result="$2"
            local state=success
            if [[ "$result" != "success" ]]; then
              state=failure
            fi

            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f "state=$state" \
              -f "context=$context" \
              -f "description=workflow_dispatch result: $result" \
              -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              >/dev/null
          }

          publish_status "pr-gate/osv / osv-scan" "$OSV_RESULT"
          publish_status "pr-gate/semgrep" "$SEMGREP_RESULT"

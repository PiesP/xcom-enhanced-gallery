name: 🔬 Deep Verification

# Responsibility: expensive checks that should not block quick PR feedback
# - Mutation testing
# - Duplication checking on the weekly schedule or on demand
#
# Manual runs can select one check to conserve Actions minutes and runner
# concurrency when investigating a single gate.

# Security: All third-party actions pinned to full commit SHAs.

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:
    inputs:
      scope:
        description: "Run all deep checks or one selected gate"
        required: true
        default: all
        type: choice
        options:
          - all
          - mutation
          - duplication
      reuse_success:
        description: "Reuse a prior successful result for identical inputs"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: deep-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duplication:
    name: 🔍 Duplication
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'duplication' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup fingerprint runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔑 Fingerprint duplication inputs
        id: fingerprint
        continue-on-error: true
        env:
          DEEP_RUNNER_LABEL: ubuntu-24.04
        run: node --experimental-strip-types scripts/ci/deep-check-reuse.ts fingerprint duplication

      - name: 📥 Restore successful duplication marker
        id: restore
        if: ${{ steps.fingerprint.outputs.cacheable == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deep-check-cache/duplication.json
          key: deep-success-v3-duplication-${{ steps.fingerprint.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            deep-success-v3-duplication-${{ steps.fingerprint.outputs.fingerprint }}-

      - name: 🔎 Validate successful duplication marker
        id: marker
        continue-on-error: true
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-matched-key != '' }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REUSE_SUCCESS: ${{ inputs.reuse_success }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/deep-check-reuse.ts verify duplication "$FINGERPRINT" .deep-check-cache/duplication.json

      - name: ♻️ Reuse successful duplication
        if: ${{ steps.marker.outputs.reuse == 'true' }}
        env:
          REASON: ${{ steps.marker.outputs.reason }}
          SAVED_SECONDS: ${{ steps.marker.outputs.saved_seconds }}
          ORIGIN_RUN_ID: ${{ steps.marker.outputs.origin_run_id }}
          ORIGIN_RUN_ATTEMPT: ${{ steps.marker.outputs.origin_run_attempt }}
          ORIGIN_SHA: ${{ steps.marker.outputs.origin_sha }}
          ORIGIN_ANALYZED_AT: ${{ steps.marker.outputs.origin_analyzed_at }}
        run: |
          echo "Duplication: reused successful result from run ${ORIGIN_RUN_ID}/${ORIGIN_RUN_ATTEMPT} (${ORIGIN_SHA}, analyzed ${ORIGIN_ANALYZED_AT}); reason: $REASON; estimated avoided analysis seconds: ${SAVED_SECONDS:-unavailable}." >> "$GITHUB_STEP_SUMMARY"

      - name: 🧾 Explain fresh duplication analysis
        if: ${{ steps.marker.outputs.reuse != 'true' }}
        env:
          REASON: ${{ steps.marker.outputs.reason }}
          ORIGIN_RUN_ID: ${{ steps.marker.outputs.origin_run_id }}
          ORIGIN_RUN_ATTEMPT: ${{ steps.marker.outputs.origin_run_attempt }}
          ORIGIN_SHA: ${{ steps.marker.outputs.origin_sha }}
        run: |
          echo "Duplication: running fresh analysis (reason: ${REASON:-verify-unavailable}; restored origin: ${ORIGIN_RUN_ID:-unavailable}/${ORIGIN_RUN_ATTEMPT:-unavailable} ${ORIGIN_SHA:-unavailable})." >> "$GITHUB_STEP_SUMMARY"

      - name: 🔧 Install nose
        if: ${{ steps.marker.outputs.reuse != 'true' }}
        run: bash scripts/ci/install-nose.sh

      - name: 🔎 Check for new duplication
        id: check
        if: ${{ steps.marker.outputs.reuse != 'true' }}
        run: nose query src --baseline .nose-baseline.json --fail-on new

      - name: ✅ Record fresh duplication pass
        if: ${{ steps.check.outcome == 'success' }}
        run: |
          echo 'Duplication: passed a fresh analysis.' >> "$GITHUB_STEP_SUMMARY"

      - name: 📝 Mark successful duplication
        id: mark
        if: ${{ steps.check.outcome == 'success' && steps.fingerprint.outputs.cacheable == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        continue-on-error: true
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: node --experimental-strip-types scripts/ci/deep-check-reuse.ts mark duplication "$FINGERPRINT" .deep-check-cache/duplication.json

      - name: 💾 Save successful duplication marker
        if: ${{ steps.mark.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deep-check-cache/duplication.json
          key: deep-success-v3-duplication-${{ steps.fingerprint.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}

  mutation:
    name: 🧬 Mutation
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.scope == 'all' || inputs.scope == 'mutation' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup fingerprint runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🔑 Fingerprint mutation inputs
        id: fingerprint
        continue-on-error: true
        env:
          DEEP_RUNNER_LABEL: ubuntu-24.04
        run: node --experimental-strip-types scripts/ci/deep-check-reuse.ts fingerprint mutation

      - name: 📥 Restore successful mutation marker
        id: restore
        if: ${{ steps.fingerprint.outputs.cacheable == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deep-check-cache/mutation.json
          key: deep-success-v3-mutation-${{ steps.fingerprint.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            deep-success-v3-mutation-${{ steps.fingerprint.outputs.fingerprint }}-

      - name: 🔎 Validate successful mutation marker
        id: marker
        continue-on-error: true
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          CACHE_HIT: ${{ steps.restore.outputs.cache-matched-key != '' }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REUSE_SUCCESS: ${{ inputs.reuse_success }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/deep-check-reuse.ts verify mutation "$FINGERPRINT" .deep-check-cache/mutation.json

      - name: ♻️ Reuse successful mutation
        if: ${{ steps.marker.outputs.reuse == 'true' }}
        env:
          REASON: ${{ steps.marker.outputs.reason }}
          SAVED_SECONDS: ${{ steps.marker.outputs.saved_seconds }}
          ORIGIN_RUN_ID: ${{ steps.marker.outputs.origin_run_id }}
          ORIGIN_RUN_ATTEMPT: ${{ steps.marker.outputs.origin_run_attempt }}
          ORIGIN_SHA: ${{ steps.marker.outputs.origin_sha }}
          ORIGIN_ANALYZED_AT: ${{ steps.marker.outputs.origin_analyzed_at }}
        run: |
          echo "Mutation: reused successful result from run ${ORIGIN_RUN_ID}/${ORIGIN_RUN_ATTEMPT} (${ORIGIN_SHA}, analyzed ${ORIGIN_ANALYZED_AT}); reason: $REASON; estimated avoided analysis seconds: ${SAVED_SECONDS:-unavailable}." >> "$GITHUB_STEP_SUMMARY"

      - name: 🧾 Explain fresh mutation analysis
        if: ${{ steps.marker.outputs.reuse != 'true' }}
        env:
          REASON: ${{ steps.marker.outputs.reason }}
          ORIGIN_RUN_ID: ${{ steps.marker.outputs.origin_run_id }}
          ORIGIN_RUN_ATTEMPT: ${{ steps.marker.outputs.origin_run_attempt }}
          ORIGIN_SHA: ${{ steps.marker.outputs.origin_sha }}
        run: |
          echo "Mutation: running fresh analysis (reason: ${REASON:-verify-unavailable}; restored origin: ${ORIGIN_RUN_ID:-unavailable}/${ORIGIN_RUN_ATTEMPT:-unavailable} ${ORIGIN_SHA:-unavailable})." >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Setup project
        if: ${{ steps.marker.outputs.reuse != 'true' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969

      - name: 🧬 Run mutation gate
        id: check
        if: ${{ steps.marker.outputs.reuse != 'true' }}
        run: pnpm mut:fast

      - name: 📊 Upload mutation reports
        id: upload
        if: ${{ steps.check.outcome != 'skipped' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ github.sha }}
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

      - name: ✅ Record fresh mutation pass
        if: ${{ steps.check.outcome == 'success' && steps.upload.outcome == 'success' }}
        run: |
          echo 'Mutation: passed a fresh analysis.' >> "$GITHUB_STEP_SUMMARY"

      - name: 📝 Mark successful mutation
        id: mark
        if: ${{ steps.check.outcome == 'success' && steps.upload.outcome == 'success' && steps.fingerprint.outputs.cacheable == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        continue-on-error: true
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
        run: node --experimental-strip-types scripts/ci/deep-check-reuse.ts mark mutation "$FINGERPRINT" .deep-check-cache/mutation.json

      - name: 💾 Save successful mutation marker
        if: ${{ steps.mark.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deep-check-cache/mutation.json
          key: deep-success-v3-mutation-${{ steps.fingerprint.outputs.fingerprint }}-${{ github.run_id }}-${{ github.run_attempt }}

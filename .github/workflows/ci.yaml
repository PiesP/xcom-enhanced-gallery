name: 🏗️ CI

# Responsibility: fast, independent verification for pull requests and merge queue
# - Run static quality checks
# - Run unit tests with coverage thresholds
# - Run browser E2E tests
# - Build all distribution targets
#
# Expensive mutation testing lives in deep-checks.yaml so PR feedback is not
# blocked by a long-running, resource-heavy analysis.
#
# Triggered on: Push/PR to master + merge queue

# Security: All third-party actions pinned to full commit SHAs.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.classify.outputs.quality }}
      unit: ${{ steps.classify.outputs.unit }}
      e2e: ${{ steps.classify.outputs.e2e }}
      build: ${{ steps.classify.outputs.build }}
    steps:
      - name: 📥 Checkout change history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: 📦 Setup classifier runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 🧭 Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          classifier=scripts/ci/classify-changes.ts
          case "$EVENT_NAME" in
            pull_request | merge_group)
              classifier="$RUNNER_TEMP/trusted-classify-changes.ts"
              # The first rollout has no TypeScript classifier in its base.
              # Select every gate without running code from the proposed head.
              if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
                 ! git show "$BASE_SHA:scripts/ci/classify-changes.ts" > "$classifier"; then
                for output in quality unit e2e build osv semgrep codeql_actions codeql_javascript; do
                  echo "$output=true" >> "$GITHUB_OUTPUT"
                done
                echo 'reason=trusted-classifier-unavailable-full' >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac
          node --experimental-strip-types "$classifier"

  quality:
    name: pr-gate/quality
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⏭️ No quality-relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.quality == 'false' }}
        run: echo "No quality-relevant changes; required check satisfied."

      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.quality != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup project
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.quality != 'false' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969

      - name: ✅ Run quality gate
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.quality != 'false' }}
        env:
          COVERAGE_OWNS_BOUNDARY: ${{ needs.changes.result != 'success' || needs.changes.outputs.unit != 'false' }}
        run: |
          if [[ "$COVERAGE_OWNS_BOUNDARY" == 'true' ]]; then
            pnpm quality:coverage-owned
          else
            pnpm quality
          fi

  unit:
    name: pr-gate/unit
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ⏭️ No unit-relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.unit == 'false' }}
        run: echo "No unit-relevant changes; required check satisfied."

      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.unit != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup project
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.unit != 'false' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969

      # Quality owns policy tests when selected; unit-only changes need them here.
      - name: 🧪 Run focused policy suite for unit-only changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.unit != 'false' && needs.changes.outputs.quality == 'false' }}
        run: pnpm test:policy

      - name: 🧪 Run unit tests and coverage thresholds
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.unit != 'false' }}
        run: pnpm test:cov

  e2e:
    name: pr-gate/e2e
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: ⏭️ No browser-relevant changes
        if: ${{ needs.changes.result == 'success' && needs.changes.outputs.e2e == 'false' }}
        run: echo "No browser-relevant changes; required check satisfied."

      - name: 📥 Checkout code
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 🦊 Cache Selenium Firefox and GeckoDriver
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/selenium
          key: selenium-firefox-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            selenium-firefox-${{ runner.os }}-

      - name: 📦 Setup project
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969

      - name: 🎭 Read installed Playwright version
        id: playwright
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false' }}
        run: node -p "'version=' + require('@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"

      - name: 🎭 Cache Playwright browsers
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-ubuntu-24.04-chromium-firefox-webkit-${{ steps.playwright.outputs.version }}

      - name: 🏗️ Build browser bundles
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false' }}
        run: pnpm build:e2e

      - name: 🎭 Run userscript and extension contract E2E tests
        if: ${{ needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false' }}
        run: |
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm test:e2e:all

      - name: 📤 Upload Playwright diagnostics
        if: ${{ failure() && (needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-diagnostics-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: pr-gate/build
    needs: [changes, quality]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: ❌ Require successful prerequisites
        if: ${{ needs.quality.result != 'success' }}
        run: exit 1

      - name: ⏭️ No build-relevant changes
        if: ${{ needs.changes.result == 'success' && needs.quality.result == 'success' && needs.changes.outputs.build == 'false' }}
        run: echo "No build-relevant changes; required check satisfied."

      - name: 📥 Checkout code
        if: ${{ (needs.changes.result != 'success' || needs.changes.outputs.build != 'false') && needs.quality.result == 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup project
        if: ${{ (needs.changes.result != 'success' || needs.changes.outputs.build != 'false') && needs.quality.result == 'success' }}
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969

      - name: 🏗️ Build all targets
        if: ${{ (needs.changes.result != 'success' || needs.changes.outputs.build != 'false') && needs.quality.result == 'success' }}
        run: pnpm build:all:ci

      - name: 📊 Upload userscript artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (needs.changes.result != 'success' || needs.changes.outputs.build != 'false') && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          name: userscript-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: 📊 Upload Chrome extension artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (needs.changes.result != 'success' || needs.changes.outputs.build != 'false') && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          name: extension-chrome-${{ github.sha }}
          path: dist-extension/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: 📊 Upload Firefox extension artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ (needs.changes.result != 'success' || needs.changes.outputs.build != 'false') && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          name: extension-firefox-${{ github.sha }}
          path: dist-extension-firefox/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

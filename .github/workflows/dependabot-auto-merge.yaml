name: 🤖 Dependabot Auto-Merge Gate

# Responsibility: Keep every dependency update visible for maintainer review
# - Security alerts prioritize review; they never authorize automatic admission
# - Publishes a policy-bound negative decision in a read-only context
# - Never checks out or executes pull-request code

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-auto-merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: 🔍 Evaluate Dependabot update
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event.sender.login == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.draft == false
    steps:
      - name: 📥 Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ github.token }}"

      - name: 🔍 Decide merge eligibility
        id: decide
        env:
          ECOSYSTEM: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
          DEPENDENCIES: ${{ steps.dependabot-metadata.outputs.dependency-names }}
          ALERT_STATE: ${{ steps.dependabot-metadata.outputs.alert-state }}
          MAINTAINER_CHANGES: ${{ steps.dependabot-metadata.outputs.maintainer-changes }}
        run: |
          set -euo pipefail

          SHOULD_MERGE="false"
          REASON="maintainer review required for all dependency updates"
          if [[ "$ALERT_STATE" == "open" || "$ALERT_STATE" == "OPEN" ]]; then
            REASON="security update requires prioritized maintainer review"
          fi

          echo "should_merge=$SHOULD_MERGE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: 🧾 Prepare immutable gate result
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.decide.outputs.reason }}
          SHOULD_MERGE: ${{ steps.decide.outputs.should_merge }}
        run: |
          set -euo pipefail

          GATE_DIR="$RUNNER_TEMP/dependabot-auto-merge-gate"
          mkdir -p "$GATE_DIR"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pull_request_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_ref "$BASE_REF" \
            --argjson eligible "$SHOULD_MERGE" \
            --arg reason "$REASON" \
            '{schema_version: 2, policy_id: "maintainer-review-v1", repository: $repository, pull_request_number: $pull_request_number, head_sha: $head_sha, base_ref: $base_ref, eligible: $eligible, reason: $reason}' \
            > "$GATE_DIR/gate.json"

      - name: 📤 Publish gate result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-auto-merge-gate
          path: ${{ runner.temp }}/dependabot-auto-merge-gate/gate.json
          if-no-files-found: error
          retention-days: 1

name: 🤖 Dependabot Auto-Merge Gate

# Responsibility: Evaluate safe Dependabot updates in a read-only context
# - GitHub Actions: patch/minor updates
# - npm: patch/minor updates for specific safe packages
# - Publishes only metadata for the trusted workflow_run apply stage
# - Never checks out or executes pull-request code

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-auto-merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: 🔍 Evaluate Dependabot update
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event.sender.login == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.draft == false
    steps:
      - name: 📥 Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ github.token }}"

      - name: 🔍 Decide merge eligibility
        id: decide
        env:
          ECOSYSTEM: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
          DEPENDENCIES: ${{ steps.dependabot-metadata.outputs.dependency-names }}
          ALERT_STATE: ${{ steps.dependabot-metadata.outputs.alert-state }}
          MAINTAINER_CHANGES: ${{ steps.dependabot-metadata.outputs.maintainer-changes }}
        run: |
          set -euo pipefail

          SHOULD_MERGE="false"
          REASON="manual review required"

          if [[ "$MAINTAINER_CHANGES" == "true" ]]; then
            REASON="maintainer changes require manual review"
          elif [[ "$ALERT_STATE" == "open" || "$ALERT_STATE" == "OPEN" ]]; then
            SHOULD_MERGE="true"
            REASON="security advisory update (open alert)"
          elif [[ "$ECOSYSTEM" == "github-actions" && ("$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor") ]]; then
            SHOULD_MERGE="true"
            REASON="safe github-actions patch/minor"
          elif [[ ("$ECOSYSTEM" == "npm" || "$ECOSYSTEM" == "npm_and_yarn") && ("$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor") ]]; then
            SAFE="true"
            IFS=',' read -ra DEPS <<< "$DEPENDENCIES"
            for dep in "${DEPS[@]}"; do
              dep=$(echo "$dep" | xargs)
              case "$dep" in
                typescript|knip|vite|vite-plugin-solid|@types/*|@biomejs/*|solid-js|@playwright/test|@stryker-mutator/*|@vitest/*|dpdm|jsdom|vitest)
                  ;;
                *)
                  SAFE="false"
                  ;;
              esac
            done

            if [[ "$SAFE" == "true" ]]; then
              SHOULD_MERGE="true"
              REASON="safe npm patch/minor set"
            fi
          fi

          echo "should_merge=$SHOULD_MERGE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: 🧾 Prepare immutable gate result
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REASON: ${{ steps.decide.outputs.reason }}
          SHOULD_MERGE: ${{ steps.decide.outputs.should_merge }}
        run: |
          set -euo pipefail

          GATE_DIR="$RUNNER_TEMP/dependabot-auto-merge-gate"
          mkdir -p "$GATE_DIR"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pull_request_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_ref "$BASE_REF" \
            --argjson eligible "$SHOULD_MERGE" \
            --arg reason "$REASON" \
            '{schema_version: 1, repository: $repository, pull_request_number: $pull_request_number, head_sha: $head_sha, base_ref: $base_ref, eligible: $eligible, reason: $reason}' \
            > "$GATE_DIR/gate.json"

      - name: 📤 Publish gate result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-auto-merge-gate
          path: ${{ runner.temp }}/dependabot-auto-merge-gate/gate.json
          if-no-files-found: error
          retention-days: 1

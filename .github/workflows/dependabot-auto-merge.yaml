name: 🤖 Dependabot Auto-Merge

# Responsibility: Maintain and auto-merge safe Dependabot PRs
# - GitHub Actions: patch/minor updates
# - npm: patch/minor updates for specific safe packages
# - Keeps eligible branches current and approves the resulting head commit
# - Requires CI to pass first (via GitHub branch protection)
#
# Security: Uses pull_request_target for the write-scoped merge operation.
# No pull-request code is checked out or executed.

on:
  # Target events are safe here because this workflow never checks out or runs
  # pull-request code; it only reads Dependabot metadata and queues a merge.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    name: 🤖 Auto-Merge Dependabot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.draft == false
    steps:
      - name: 📥 Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: 🔍 Decide merge eligibility
        id: decide
        env:
          ECOSYSTEM: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
          DEPENDENCIES: ${{ steps.dependabot-metadata.outputs.dependency-names }}
          ALERT_STATE: ${{ steps.dependabot-metadata.outputs.alert-state }}
        run: |
          set -euo pipefail

          SHOULD_MERGE="false"
          REASON="manual review required"

          if [[ "$ALERT_STATE" == "open" ]]; then
            SHOULD_MERGE="true"
            REASON="security advisory update (open alert)"
          elif [[ "$ECOSYSTEM" == "github-actions" && ("$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor") ]]; then
            SHOULD_MERGE="true"
            REASON="safe github-actions patch/minor"
          elif [[ ("$ECOSYSTEM" == "npm" || "$ECOSYSTEM" == "npm_and_yarn") && ("$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor") ]]; then
            SAFE="true"
            IFS=',' read -ra DEPS <<< "$DEPENDENCIES"
            for dep in "${DEPS[@]}"; do
              dep=$(echo "$dep" | xargs)
              case "$dep" in
                typescript|knip|vite|vite-plugin-solid|@types/*|@biomejs/*|solid-js|@playwright/test|@stryker-mutator/*|@vitest/*|dpdm|jsdom|vitest)
                  ;;
                *)
                  SAFE="false"
                  ;;
              esac
            done

            if [[ "$SAFE" == "true" ]]; then
              SHOULD_MERGE="true"
              REASON="safe npm patch/minor set"
            fi
          fi

          echo "should_merge=$SHOULD_MERGE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: 🔄 Update branch from the default branch
        if: steps.decide.outputs.should_merge == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          BASE_SHA="$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/$BASE_REF" \
            --jq '.commit.sha')"
          BEHIND_BY="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
            --jq '.behind_by')"
          if (( BEHIND_BY == 0 )); then
            echo "✅ Dependabot branch is already current."
            exit 0
          fi

          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/update-branch" \
            --raw-field expected_head_sha="$HEAD_SHA"

          for _ in {1..15}; do
            CURRENT_HEAD="$(gh api \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '.head.sha')"
            if [[ "$CURRENT_HEAD" != "$HEAD_SHA" ]]; then
              echo "✅ Dependabot branch updated to $CURRENT_HEAD."
              exit 0
            fi
            sleep 2
          done

          echo "::error::Timed out waiting for the Dependabot branch update."
          exit 1

      - name: ✅ Approve eligible update
        if: steps.decide.outputs.should_merge == 'true'
        env:
          APPROVAL_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          if [[ -z "$APPROVAL_TOKEN" ]]; then
            echo "::error::AUTO_MERGE_TOKEN is required to approve automated PRs."
            exit 1
          fi

          GH_TOKEN="$APPROVAL_TOKEN" gh pr review --approve "$PR_URL"
          echo "✅ Approved eligible Dependabot update."

      - name: 🔄 Queue auto-merge
        if: steps.decide.outputs.should_merge == 'true'
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "$PR_URL"
          echo "✅ Auto-merge queued: ${{ steps.decide.outputs.reason }}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ⏭️ Keep for manual review
        if: steps.decide.outputs.should_merge != 'true'
        run: |
          echo "⏭️ Manual review required"
          echo "Reason: ${{ steps.decide.outputs.reason }}"

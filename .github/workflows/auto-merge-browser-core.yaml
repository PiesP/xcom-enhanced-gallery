name: 🤖 Auto-Merge browser-core

# Responsibility: Auto-merge safe browser-core update PRs created by the
# update-browser-core workflow. These PRs only change the submodule gitlink;
# all source validation is handled by the required CI status checks.
#
# The AUTO_MERGE_TOKEN secret (a PAT with repo scope from the repo owner)
# is needed to approve the PR, since github-actions[bot] cannot self-approve.
# Without it, the PR will need a manual approving review.
#
# Security: Uses pull_request_target to avoid checking out PR code.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-browser-core-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: 🤖 Auto-Merge browser-core PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'automation/update-browser-core'
    steps:
      - name: 🔍 Verify browser-core-only change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          FILES="$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')"
          for file in $FILES; do
            if [[ "$file" != "packages/core" ]]; then
              echo "::warning::PR #$PR_NUMBER touches unexpected file: $file"
              echo "Skipping auto-merge — manual review required."
              exit 0
            fi
          done

          echo "✅ PR #$PR_NUMBER only changes packages/core submodule."

      - name: ✅ Approve PR
        if: ${{ secrets.AUTO_MERGE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr review --approve "$PR_NUMBER"
          echo "✅ PR #$PR_NUMBER approved."

      - name: ⚠️ Approval fallback
        if: ${{ secrets.AUTO_MERGE_TOKEN == '' }}
        run: |
          echo "::warning::AUTO_MERGE_TOKEN secret is not configured."
          echo "The PR will need a manual approving review before auto-merge can complete."
          echo "Create a PAT with repo scope and add it as AUTO_MERGE_TOKEN in repository secrets."

      - name: 🔄 Queue auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash "$PR_NUMBER"
          echo "✅ Auto-merge queued for browser-core update PR #$PR_NUMBER."
          echo "Merge will complete when all required status checks pass."

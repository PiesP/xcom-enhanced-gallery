name: 🚀 Release

# Responsibility: validate and publish tagged userscript and browser extension
# releases. Validation runs independently; only publish can write repository state.
#
# Trigger: Tag push (v*)

# Security: All third-party actions pinned to full commit SHAs.

on:
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "26"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: ✅ Release quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup pnpm and Node.js
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ✅ Run quality gate
        run: pnpm quality

  unit:
    name: 🧪 Release unit + coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup pnpm and Node.js
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run unit tests and coverage thresholds
        run: pnpm test:cov

  e2e:
    name: 🎭 Release E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup pnpm and Node.js
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🎭 Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build bundles for E2E
        run: |
          pnpm clean
          pnpm build:ci
          pnpm build:dev
          pnpm build:extension:ci
          pnpm build:extension:firefox:ci

      - name: 🎭 Run E2E tests
        run: |
          pnpm exec playwright install --with-deps chromium firefox
          pnpm test:e2e
          pnpm test:e2e:extension

  duplication:
    name: 🔍 Release duplication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 🔧 Install nose
        run: bash scripts/ci/install-nose.sh

      - name: 🔎 Check for new duplication
        run: nose query src --baseline .nose-baseline.json --fail-on new

  mutation:
    name: 🧬 Release mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: 📦 Setup pnpm and Node.js
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧬 Run mutation gate
        run: pnpm mut:fast

  build:
    name: 🏗️ Build release package
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - name: 📦 Setup pnpm and Node.js
        uses: ./.github/actions/setup-toolchain
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📝 Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version from tag: $VERSION (expected X.Y.Z)"
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "❌ Tag version $VERSION does not match package.json $PACKAGE_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Release version: $VERSION"

      - name: 🏗️ Build all targets
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm build:all:ci

      - name: 📦 Prepare release bundle
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm release:prepare

      - name: 📊 Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  publish:
    name: 🏷️ Publish GitHub Release
    needs: [quality, unit, e2e, duplication, mutation, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 📥 Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.sha }}
          path: release-bundle

      # Keep the existing /dist release-branch layout; the userscript URLs
      # in this project intentionally point at /release/dist/.
      - name: 📤 Publish to release branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release
          publish_dir: release-bundle/deploy
          force_orphan: true

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-bundle/RELEASE_NOTES.md
          files: |
            release-bundle/release/xcom-enhanced-gallery.user.js
            release-bundle/release/xcom-enhanced-gallery.meta.js
            release-bundle/release/xcom-enhanced-gallery-chrome.zip
            release-bundle/release/xcom-enhanced-gallery-firefox.zip
            release-bundle/release/checksums.txt
            release-bundle/release/metadata.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  purge-cdn:
    name: 🔄 Purge jsDelivr CDN cache
    needs: publish
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: 🔄 Purge userscript and metadata cache
        run: |
          set -euo pipefail
          for asset in xcom-enhanced-gallery.user.js xcom-enhanced-gallery.meta.js; do
            purge_url="https://purge.jsdelivr.net/gh/${{ github.repository }}@release/dist/${asset}"
            purge_response="$(curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 "$purge_url")"
            echo "$purge_response" | jq -e '
              (.success == true) or
              (.status == "finished" and ([.paths[].providers[]] | all))
            ' >/dev/null
          done

name: 🚀 Release

# Responsibility: validate and publish tagged userscript and browser extension
# releases. Validation runs independently; only publish can write repository state.
#
# Trigger: Manual dispatch from protected master for an existing v* tag.

# Security: All third-party actions pinned to full commit SHAs.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z) contained in protected master
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /etc/ssl/certs

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  provenance:
    name: 🔐 Verify protected release source
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release-sha: ${{ steps.verify.outputs.release-sha }}
      version: ${{ steps.verify.outputs.version }}
      node-version: ${{ steps.verify.outputs.node-version }}
    steps:
      - name: 🔐 Prepare Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust

      - name: 📥 Checkout protected workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 📦 Setup trusted provenance runtime
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          install-dependencies: 'false'

      - name: 🔐 Verify tag belongs to protected master
        id: verify
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node --experimental-strip-types scripts/release/verify-source.ts

  quality:
    name: ✅ Release quality
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 🔐 Prepare Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust

      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 📦 Setup project
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: ✅ Run quality gate
        run: pnpm quality:coverage-owned

  unit:
    name: 🧪 Release unit + coverage
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 🔐 Prepare Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust

      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 📦 Setup project
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: 🧪 Run unit tests and coverage thresholds
        run: pnpm test:cov

  e2e:
    name: 🎭 Release E2E
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 🔐 Prepare Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust

      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 📦 Setup project
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: 🏗️ Build bundles for E2E
        run: pnpm build:e2e

      - name: 🎭 Run E2E tests
        run: |
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm test:e2e:all

  build:
    name: 🏗️ Build release package
    needs: [provenance, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 🔐 Prepare Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust

      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: true
          fetch-tags: true
          persist-credentials: false

      - name: Checkout verified release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: |
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: 📦 Setup project
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          node-version: ${{ needs.provenance.outputs.node-version }}

      - name: 🏗️ Build all targets
        env:
          BUILD_VERSION: ${{ needs.provenance.outputs.version }}
        run: pnpm build:all:ci

      - name: 📦 Prepare release bundle
        env:
          RELEASE_VERSION: ${{ needs.provenance.outputs.version }}
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: pnpm release:prepare

      - name: 📊 Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ needs.provenance.outputs.release-sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  publish:
    name: 🏷️ Publish GitHub Release
    needs: [provenance, quality, unit, e2e, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: xcom-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: 🔐 Prepare Node trust
        uses: PiesP/browser-core/automation/actions/prepare-node-trust@381b4ca733494cf069212cd0d16458389a83c623
        id: node_trust

      - name: Checkout protected publication guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 📦 Setup trusted publication runtime
        uses: PiesP/browser-core/automation/actions/setup-project@38cd1cb18c9c37e57e8b53a98e811450bb1a18fc
        with:
          install-dependencies: 'false'

      - name: 📥 Download release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle-${{ needs.provenance.outputs.release-sha }}
          path: release-bundle

      - name: Revalidate live source and publication ordering
        id: publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: node scripts/release/verify-publication.ts

      - name: 🏷️ Create GitHub Release
        if: steps.publication.outputs.publish == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          body_path: release-bundle/RELEASE_NOTES.md
          files: |
            release-bundle/release/xcom-enhanced-gallery.user.js
            release-bundle/release/xcom-enhanced-gallery.meta.js
            release-bundle/release/xcom-enhanced-gallery-chrome.zip
            release-bundle/release/xcom-enhanced-gallery-firefox.zip
            release-bundle/release/checksums.txt
            release-bundle/release/metadata.json
          draft: false
          prerelease: false
          make_latest: ${{ steps.publication.outputs.make-latest }}
          overwrite_files: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

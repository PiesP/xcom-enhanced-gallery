name: 🚀 Release

# Responsibility: validate and publish tagged userscript and browser extension
# releases. Validation runs independently; only publish can write repository state.
#
# Trigger: Manual dispatch from protected master for an existing v* tag.

# Security: All third-party actions pinned to full commit SHAs.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z) contained in protected master
        required: true
        type: string

env:
  NODE_VERSION: "26"

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  provenance:
    name: 🔐 Verify protected release source
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release-sha: ${{ steps.verify.outputs.release-sha }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - name: 📥 Checkout protected workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 🔐 Verify tag belongs to protected master
        id: verify
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid release tag: $RELEASE_TAG (expected vX.Y.Z)"
            exit 1
          fi
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          release_sha="$(git rev-parse --verify "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$release_sha" "$GITHUB_SHA"; then
            echo "❌ Release tag $RELEASE_TAG is not contained in protected master $GITHUB_SHA"
            exit 1
          fi
          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  quality:
    name: ✅ Release quality
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.release-sha }}
          submodules: true

      - name: 📦 Setup project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: ✅ Run quality gate
        run: pnpm quality

  unit:
    name: 🧪 Release unit + coverage
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.release-sha }}
          submodules: true

      - name: 📦 Setup project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🧪 Run unit tests and coverage thresholds
        run: pnpm test:cov

  e2e:
    name: 🎭 Release E2E
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.release-sha }}
          submodules: true

      - name: 🎭 Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: 🦊 Cache Selenium Firefox and GeckoDriver
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/selenium
          key: selenium-firefox-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            selenium-firefox-${{ runner.os }}-

      - name: 📦 Setup project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🏗️ Build bundles for E2E
        run: pnpm build:e2e

      - name: 🎭 Run E2E tests
        run: |
          pnpm exec playwright install --with-deps chromium firefox webkit
          pnpm test:e2e:all

  duplication:
    name: 🔍 Release duplication
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.release-sha }}
          submodules: true

      - name: 🔧 Install nose
        run: bash scripts/ci/install-nose.sh

      - name: 🔎 Check for new duplication
        run: nose query src --baseline .nose-baseline.json --fail-on new

  mutation:
    name: 🧬 Release mutation
    needs: provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.release-sha }}
          submodules: true

      - name: 📦 Setup project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 🧬 Run mutation gate
        run: pnpm mut:fast

  build:
    name: 🏗️ Build release package
    needs: [provenance, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.provenance.outputs.release-sha }}
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - name: 📦 Setup project
        uses: ./.github/actions/setup-release
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📝 Determine version
        shell: bash
        env:
          VERSION: ${{ needs.provenance.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "❌ Tag version $VERSION does not match package.json $PACKAGE_VERSION"
            exit 1
          fi
          echo "📦 Release version: $VERSION"

      - name: 🏗️ Build all targets
        env:
          BUILD_VERSION: ${{ needs.provenance.outputs.version }}
        run: pnpm build:all:ci

      - name: 📦 Prepare release bundle
        env:
          RELEASE_VERSION: ${{ needs.provenance.outputs.version }}
          RELEASE_SHA: ${{ needs.provenance.outputs.release-sha }}
        run: pnpm release:prepare

      - name: 📊 Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ needs.provenance.outputs.release-sha }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  publish:
    name: 🏷️ Publish GitHub Release
    needs: [provenance, quality, unit, e2e, duplication, mutation, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 📥 Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ needs.provenance.outputs.release-sha }}
          path: release-bundle

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag }}
          body_path: release-bundle/RELEASE_NOTES.md
          files: |
            release-bundle/release/xcom-enhanced-gallery.user.js
            release-bundle/release/xcom-enhanced-gallery.meta.js
            release-bundle/release/xcom-enhanced-gallery-chrome.zip
            release-bundle/release/xcom-enhanced-gallery-firefox.zip
            release-bundle/release/checksums.txt
            release-bundle/release/metadata.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

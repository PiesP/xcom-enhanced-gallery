name: 🤖 Dependabot Auto-Merge Apply

# Responsibility: Validate the current review policy without admission authority
# - Rejects old or positive gate artifacts before exporting a decision
# - Retains exact PR/commit provenance checks and leaves admission to maintainers
# - Never approves or queues a dependency update

on:
  workflow_run:
    workflows: ["🤖 Dependabot Auto-Merge Gate"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-auto-merge-apply-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  validate:
    name: 🔎 Validate Dependabot decision
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      pull_request_number: ${{ steps.gate.outputs.pull_request_number }}
      head_sha: ${{ steps.gate.outputs.head_sha }}
      base_ref: ${{ steps.gate.outputs.base_ref }}
      reason_base64: ${{ steps.gate.outputs.reason_base64 }}
    steps:
      # workflow_run artifacts are untrusted data; execute only default-branch code.
      - name: 📥 Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          submodules: false

      - name: 📦 Setup trusted script runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: 📥 Download exact gate result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependabot-auto-merge-gate
          path: ${{ runner.temp }}/dependabot-auto-merge-gate
          github-token: "${{ github.token }}"
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          digest-mismatch: error

      - name: 🔎 Read gate result
        id: gate
        env:
          GATE_PATH: ${{ runner.temp }}/dependabot-auto-merge-gate/gate.json
        run: node --experimental-strip-types scripts/ci/dependabot-apply.ts gate

      - name: 🔒 Revalidate pull request and commits
        env:
          BASE_REF: ${{ steps.gate.outputs.base_ref }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          PR_NUMBER: ${{ steps.gate.outputs.pull_request_number }}
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/ci/dependabot-apply.ts validate

      - name: ⏭️ Keep for manual review
        env:
          REASON_BASE64: ${{ steps.gate.outputs.reason_base64 }}
        run: node --experimental-strip-types scripts/ci/dependabot-apply.ts manual

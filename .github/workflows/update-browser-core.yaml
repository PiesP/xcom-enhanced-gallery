name: Update browser-core

on:
  # Rebuild an open automation branch immediately whenever its base advances.
  push:
    branches: [master]
    paths-ignore:
      - packages/core
  repository_dispatch:
    types: [browser-core-updated]
  schedule:
    - cron: "17 2 * * 0" # Weekly reconciliation; repository_dispatch remains immediate.
  workflow_dispatch:
    inputs:
      core_sha:
        description: Optional browser-core commit SHA (defaults to master)
        required: false
        type: string
      preflight:
        description: Run manual CI and security diagnostics after publishing
        required: false
        default: false
        type: boolean
      dry_run:
        description: Classify the live core revision without remote writes
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  CORE_REPOSITORY: PiesP/browser-core

concurrency:
  group: browser-core-update
  cancel-in-progress: true

jobs:
  update:
    name: Create browser-core update PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Do not initialize the recorded gitlink here. If browser-core history
          # was rewritten and the old SHA disappeared, this workflow must still
          # be able to repair the consumer repository.
          submodules: false
          # Dispatch and scheduled runs also execute the reviewed default branch.
          ref: master

      - name: Setup trusted script runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: Prepare browser-core update
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_CORE_REPOSITORY: ${{ github.event.client_payload.core_repository }}
          EVENT_CORE_SHA: ${{ github.event.client_payload.core_sha }}
          INPUT_CORE_SHA: ${{ inputs.core_sha }}
        run: node --experimental-strip-types scripts/ci/update-browser-core.ts prepare

      - name: Classify browser-core consumer impact
        id: impact
        if: steps.prepare.outputs.ready == 'true'
        uses: PiesP/browser-core/automation/actions/consumer-impact@49969d6847f1a7c5130304d4aa25455fdd87e4eb
        with:
          base-sha: ${{ steps.prepare.outputs.base }}
          head-sha: ${{ steps.prepare.outputs.head }}

      - name: Publish browser-core update
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          PREFLIGHT: ${{ inputs.preflight }}
          CONSUMER_IMPACT: ${{ steps.impact.outputs.impact }}
        run: node --experimental-strip-types scripts/ci/update-browser-core.ts publish

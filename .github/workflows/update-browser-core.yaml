name: Update browser-core

on:
  # Rebuild an open automation branch immediately whenever its base advances.
  push:
    branches: [master]
    paths-ignore:
      - packages/core
  repository_dispatch:
    types: [browser-core-updated]
  schedule:
    - cron: "17 2 * * 0" # Weekly reconciliation; repository_dispatch remains immediate.
  workflow_dispatch:
    inputs:
      core_sha:
        description: Optional browser-core commit SHA (defaults to master)
        required: false
        type: string
      preflight:
        description: Run manual CI and security diagnostics after publishing
        required: false
        default: false
        type: boolean
      dry_run:
        description: Classify the live core revision without remote writes
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

env:
  CORE_REPOSITORY: PiesP/browser-core

concurrency:
  group: browser-core-update
  cancel-in-progress: true

jobs:
  classify:
    name: Classify browser-core update without write authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      base: ${{ steps.prepare.outputs.base }}
      head: ${{ steps.prepare.outputs.head }}
      impact: ${{ steps.impact.outputs.impact }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Do not initialize the recorded gitlink here. If browser-core history
          # was rewritten and the old SHA disappeared, this workflow must still
          # be able to repair the consumer repository.
          submodules: false
          # Dispatch and scheduled runs also execute the reviewed default branch.
          ref: master
          persist-credentials: false

      - name: Setup trusted script runtime
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: Prepare browser-core update
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_CORE_REPOSITORY: ${{ github.event.client_payload.core_repository }}
          EVENT_CORE_SHA: ${{ github.event.client_payload.core_sha }}
          INPUT_CORE_SHA: ${{ inputs.core_sha }}
        run: node --experimental-strip-types scripts/ci/update-browser-core.ts prepare

      - name: Classify browser-core consumer impact
        id: impact
        if: steps.prepare.outputs.ready == 'true'
        uses: PiesP/browser-core/automation/actions/consumer-impact@f9a7feec01970394bc6291b63abdd792b6d050e1
        with:
          base-sha: ${{ steps.prepare.outputs.base }}
          head-sha: ${{ steps.prepare.outputs.head }}

      - name: Preview browser-core publication without writes
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: 'true'
          PREFLIGHT: 'false'
          CONSUMER_IMPACT: ${{ steps.impact.outputs.impact }}
        run: node --experimental-strip-types scripts/ci/update-browser-core.ts publish

  publish:
    name: Publish revalidated browser-core update PR
    needs: classify
    if: needs.classify.outputs.ready == 'true' && inputs.dry_run != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          ref: master
          persist-credentials: false

      - name: Setup trusted script runtime without dependencies
        uses: PiesP/browser-core/automation/actions/setup-project@279124fa998847bd0184d2de12bdaadcd6d2f969
        with:
          install-dependencies: 'false'

      - name: Reprepare and revalidate current revisions
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CORE_SHA: ${{ needs.classify.outputs.head }}
        run: node --experimental-strip-types scripts/ci/update-browser-core.ts prepare

      - name: Publish only the classified revisions
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLASSIFIED_BASE_SHA: ${{ needs.classify.outputs.base }}
          CLASSIFIED_CORE_SHA: ${{ needs.classify.outputs.head }}
          CONSUMER_IMPACT: ${{ needs.classify.outputs.impact }}
          DRY_RUN: 'false'
          PREFLIGHT: ${{ inputs.preflight }}
        run: node --experimental-strip-types scripts/ci/update-browser-core.ts publish

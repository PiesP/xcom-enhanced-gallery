# Dependabot configuration for xcom-enhanced-gallery
# Optimized for Solid.js userscript project

version: 2
updates:
  # Root workspace npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Keep only a short supply-chain cooling window for this fast-moving project.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5  # 4 groups; allow parallel group PRs
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    reviewers:
      - "PiesP"

    # Auto-rebase to reduce merge conflicts
    rebase-strategy: "auto"

    # Keep normal updates to direct dependencies; security updates remain
    # governed by the OSV and Dependabot security-update paths.
    allow:
      - dependency-type: "direct"

    # Group updates by category to reduce PR noise
    groups:
      # Production dependency (only solid-js)
      solid:
        patterns:
          - "solid-js"
        update-types:
          - "minor"
          - "patch"

      # Build tooling (Vite + plugins)
      build:
        patterns:
          - "vite"
          - "vite-plugin-*"
        update-types:
          - "minor"
          - "patch"

      # TypeScript ecosystem
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

      # Linting and formatting (Biome + Knip)
      quality:
        patterns:
          - "@biomejs/*"
          - "knip"
        update-types:
          - "minor"
          - "patch"

  # Codex Security CLI and its integrity-locked npm closure
  - package-ecosystem: "npm"
    directory: "/scripts/security/codex-security"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 2
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps-security)"
    reviewers:
      - "PiesP"
    labels:
      - "dependencies"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Keep only a short supply-chain cooling window for this fast-moving project.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3  # Limit concurrent PRs
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
    reviewers:
      - "PiesP"
    groups:
      actions:
        patterns:
          - "*"

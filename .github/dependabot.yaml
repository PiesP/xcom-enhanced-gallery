# Dependabot configuration for xcom-enhanced-gallery
# Optimized for Solid.js userscript project

version: 2
updates:
  # Root workspace npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Batch routine dependency review once per week; security alerts remain
    # visible through the normal advisory and scanner paths.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    reviewers:
      - "PiesP"

    # Auto-rebase to reduce merge conflicts
    rebase-strategy: "auto"

    # Keep normal updates to direct dependencies; security updates remain
    # governed by the OSV and Dependabot security-update paths.
    allow:
      - dependency-type: "direct"

    # Group updates by category to reduce PR noise
    groups:
      vite-plus:
        patterns:
          - "vite-plus"
        update-types:
          - "minor"
          - "patch"

      # Production dependency (only solid-js)
      solid:
        patterns:
          - "solid-js"
        update-types:
          - "minor"
          - "patch"

      # Build plugins; the Vite/Vitest/coverage toolchain follows vite-plus.
      build:
        patterns:
          - "vite-plugin-*"
        update-types:
          - "minor"
          - "patch"

      # TypeScript ecosystem
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

    # Vite+ owns these component versions; keep its own update PR visible.
    ignore:
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@vitest/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "@voidzero-dev/vite-plus-core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # GitHub Actions updates
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-release"
    schedule:
      interval: "weekly"
      time: "09:00"
      timezone: "Asia/Seoul"
    # Batch routine Actions review once per week; urgent fixes can still be
    # requested manually or through security advisories.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 3  # Limit concurrent PRs
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
    reviewers:
      - "PiesP"
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      pnpm-setup:
        patterns:
          - "pnpm/action-setup"
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
          - "pnpm/action-setup"

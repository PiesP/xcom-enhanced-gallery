name: Setup pinned pnpm and Node.js
description: Install the repository-pinned pnpm and Node.js runtime

inputs:
  node-version:
    description: Node.js version passed to pnpm/setup
    required: true

runs:
  using: composite
  steps:
    - name: Install pnpm and Node.js
      uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
      with:
        package-json-file: package.json
        runtime: "node@${{ inputs.node-version }}"
        cache: true
        install: false

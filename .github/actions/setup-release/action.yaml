name: Setup release project
description: Configure the pinned release toolchain and install locked dependencies without runtime hooks

inputs:
  node-version:
    description: Node.js version passed to pnpm/setup
    required: true

runs:
  using: composite
  steps:
    - name: Install pnpm and Node.js
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        package-json-file: package.json
        runtime: "node@${{ inputs.node-version }}"
        cache: false
        install: false

    - name: Install release dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --no-runtime

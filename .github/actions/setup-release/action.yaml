name: Setup release project
description: Configure the pinned release toolchain and install locked dependencies without runtime hooks

inputs:
  node-version:
    description: Verified source manifest pin, retained for older tagged action compatibility
    required: false

runs:
  using: composite
  steps:
    - name: Resolve the official manifest-pinned runtime
      id: runtime
      shell: bash
      env:
        REQUESTED_NODE_VERSION: ${{ inputs.node-version }}
      run: node "$GITHUB_ACTION_PATH/resolve-runtime.mjs"

    - name: Install pnpm and Node.js
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        package-json-file: package.json
        runtime: "node@${{ steps.runtime.outputs.version }}"
        cache: false
        install: false

    - name: Install release dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --no-runtime

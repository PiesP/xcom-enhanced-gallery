name: Setup release project
description: Configure the pinned release toolchain and install locked dependencies without runtime hooks

inputs:
  node-version:
    description: Verified source manifest pin, retained for older tagged action compatibility
    required: false

runs:
  using: composite
  steps:
    - name: Resolve the official manifest-pinned runtime
      id: runtime
      shell: bash
      env:
        REQUESTED_NODE_VERSION: ${{ inputs.node-version }}
      run: node "$GITHUB_ACTION_PATH/resolve-runtime.mjs"

    - name: Install the selected Node.js runtime
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.runtime.outputs.version }}
        package-manager-cache: false

    - name: Install the manifest-pinned pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: package.json
        cache: false
        run_install: false
        standalone: false

    - name: Install release dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --no-runtime

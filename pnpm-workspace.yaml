# Keep transitive qs users on patched releases for CVE-2026-8723.
overrides:
  qs@>=6.11.1: ">=6.15.2"

allowBuilds:
  esbuild: true

strictDepBuilds: true

blockExoticSubdeps: true

# Fail if the current Node.js / pnpm version doesn't match engines field.
engineStrict: true

# Prefer current releases while retaining a short supply-chain observation window.
minimumReleaseAge: 1440
# Reject registry metadata that cannot prove a package has cleared the window.
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Old transitive releases predate widespread provenance; scrutinize recent ones.
trustPolicyIgnoreAfter: 525600

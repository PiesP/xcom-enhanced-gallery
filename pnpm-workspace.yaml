# Keep transitive qs users on the first patched version for CVE-2026-8723.
overrides:
  qs@>=6.11.1: ">=6.15.2"

# Dependabot cooldown (7 days) handles supply-chain cooling;
# minimumReleaseAge removed to avoid pnpm --no-save conflicts with Dependabot.

allowBuilds:
  esbuild: true

strictDepBuilds: true

blockExoticSubdeps: true

# Fail if the current Node.js / pnpm version doesn't match engines field.
engineStrict: true

preferFrozenLockfile: true
autoInstallPeers: true
strictPeerDependencies: false
preferOffline: true

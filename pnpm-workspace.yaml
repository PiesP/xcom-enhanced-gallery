overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

allowBuilds:
  esbuild: true

strictDepBuilds: true

blockExoticSubdeps: true

# Fail if the current Node.js / pnpm version doesn't match engines field.
engineStrict: true

# Keep paired tooling and plugin peer requirements compatible during installs.
strictPeerDependencies: true

# The exact managed alias bundles Vite 8.3.4, within these callers' peer ranges.
# Recheck callers, alias and bundled Vite together on each toolchain update.
peerDependencyRules:
  allowedVersions:
    "@vitest/mocker@5.0.4>vite": 1.2.0
    "vitest@5.0.4>vite": 1.2.0
    "vite-plugin-solid@2.11.14>vite": 1.2.0
    "vitefu@1.1.3>vite": 1.2.0

# Prefer current releases while retaining a short supply-chain observation window.
minimumReleaseAge: 1440
# Reject registry metadata that cannot prove a package has cleared the window.
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
# Old transitive releases predate widespread provenance; scrutinize recent ones.
trustPolicyIgnoreAfter: 525600
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vitest: 5.0.4
  vite-plus: 1.2.0
  "@vitest/coverage-v8": 5.0.4
